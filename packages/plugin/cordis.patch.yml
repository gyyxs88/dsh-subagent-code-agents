# dsh-subagent-code-agents bundle patch.
#
# Applied when this package is listed in your profile's `dsh.profile.bundles`.
# Registers three subagent providers on the HOST plane (the `subagents`
# registry is a process singleton; providers must register here, never in an
# agent preset):
#
#   coding-agent/codex        — OpenAI Codex CLI
#   coding-agent/claude-code  — Anthropic Claude Code CLI
#   coding-agent/grok-build   — Grok Build CLI
#
# Provider names carry the `coding-agent/` prefix so they coexist with the
# legacy `dsh-subagent-codex` plugin (which registers plain `codex`) — both can
# be loaded side by side.
#
# TOOLS: the host-plane auto-tool policy contributes `subagent_code`,
# `coding_sessions_*` and `coding_run*` to every composed agent preset except
# `minimal`. It uses agent-scoped effects instead of rewriting DSH's shipped
# preset files, so the policy survives DSH upgrades and also covers custom
# presets. Blank-session preset switches are reconciled in both directions so
# `minimal` never inherits tools from the default preset. A preset that already mounts `dsh-subagent-code-agents/tool` keeps
# that explicit configuration; duplicate registration is skipped.
# Additional ACP instances are intentionally opt-in and must be added as
# separate rows with `channel: acp`, `id`, `command` and optional `args`.
- insert:
    - id: coding-agent-tools-auto
      name: 'dsh-subagent-code-agents/auto-tool'
      config:
        excludedPresets:
          - minimal
    - id: coding-agent-codex
      name: 'dsh-subagent-code-agents'
      config:
        channel: codex
        providerName: coding-agent/codex
    - id: coding-agent-claude-code
      name: 'dsh-subagent-code-agents'
      config:
        channel: claude-code
        providerName: coding-agent/claude-code
    - id: coding-agent-grok-build
      name: 'dsh-subagent-code-agents'
      config:
        channel: grok-build
        providerName: coding-agent/grok-build
